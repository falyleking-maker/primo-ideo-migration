<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion | Primo-Idéo</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>

<header class="site-header">
    <div class="container">

        <nav class="main-nav">
            <a href="../index.html">Accueil</a>
            <a href="services.html">Aide</a>
            <a href="mon-compte.html">Mon compte</a>
            <a href="connexion.html">Connexion</a>
            <a href="panier.html">Panier</a>
            <a href="paiement.html">Commander</a>
        </nav>

    </div>
</header>

<section class="page-hero">
    <div class="container">
        <h1>Mon compte</h1>
        <p>Connexion à votre compte Primo-Idéo</p>
    </div>
</section>

<main class="content">

    <div class="container">

        <section class="account-section">

            <h2>J'ai déjà un compte</h2>

            <p>
                Les champs précédés du signe * sont obligatoires.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">
                        Adresse e-mail *
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        Mot de passe *
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p>
                    <a href="#" id="forgotPassword">
                        Mot de passe oublié ?
                    </a>
                </p>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Se connecter
                </button>

                <div id="loginMessage"></div>

            </form>

        </section>

        <hr>

        <section class="account-section">

            <h2>Je crée un nouveau compte</h2>

            <p>
                Vous ne possédez pas encore de compte ?
            </p>

            <a
                href="inscription.html"
                class="btn btn-primary"
            >
                Créer un nouveau compte
            </a>

        </section>

    </div>

</main>

<script src="../assets/js/account.js"></script>

</body>
</html>
