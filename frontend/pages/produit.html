<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Produit | Primo-Idéo</title>

    <!-- CSS du projet -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">

    <!-- Icônes -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =====================================================
           PAGE PRODUIT - DESIGN PRIMO-IDÉO
           ===================================================== */

        .product-page {
            background: #f7f7f7;
            padding: 30px 0 60px;
            min-height: 70vh;
        }

        .product-container {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px;
        }

        /* Fil d'Ariane */

        .breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #777;
        }

        .breadcrumb a {
            color: #f58220;
            text-decoration: none;
            font-weight: 600;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb i {
            font-size: 11px;
            color: #aaa;
        }

        /* Carte principale */

        .product-main-card {
            background: #fff;
            border: 1px solid #e1e1e1;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 45px;
            padding: 35px;
        }

        /* Zone image */

        .product-image-area {
            min-width: 0;
        }

        .product-image-box {
            background: #fff;
            border: 1px solid #eee;
            min-height: 470px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .product-image-box img {
            display: block;
            width: 100%;
            max-width: 500px;
            height: 430px;
            object-fit: contain;
            transition: transform .3s ease;
        }

        .product-image-box:hover img {
            transform: scale(1.04);
        }

        .no-image {
            text-align: center;
            color: #999;
            font-size: 15px;
        }

        .no-image i {
            display: block;
            font-size: 55px;
            margin-bottom: 15px;
            color: #ddd;
        }

        /* Galerie */

        .product-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .gallery-item {
            height: 90px;
            border: 1px solid #ddd;
            background: #fff;
            padding: 6px;
            cursor: pointer;
            transition: .2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-item:hover,
        .gallery-item.active {
            border-color: #f58220;
            box-shadow: 0 0 0 1px #f58220;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Informations produit */

        .product-info {
            padding: 5px 0;
        }

        .product-brand {
            display: inline-block;
            background: #111;
            color: #fff;
            padding: 7px 13px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 30px;
            line-height: 1.25;
            color: #111;
            margin: 0 0 20px;
            font-weight: 700;
        }

        .product-reference {
            color: #777;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .product-reference strong {
            color: #333;
        }

        /* Catégorie */

        .product-category {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .category-badge {
            display: inline-block;
            background: #fff3e8;
            color: #d96a0b;
            border: 1px solid #ffd5b2;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Prix */

        .product-price-box {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 20px 0;
            margin-bottom: 25px;
        }

        .price-label {
            display: block;
            font-size: 13px;
            color: #777;
            margin-bottom: 5px;
        }

        .product-price {
            color: #f58220;
            font-size: 34px;
            font-weight: 800;
            margin: 0;
        }

        /* Description */

        .description-box {
            margin-bottom: 28px;
        }

        .description-box h3 {
            font-size: 18px;
            color: #111;
            margin: 0 0 10px;
        }

        .description-box h3::after {
            content: "";
            display: block;
            width: 45px;
            height: 3px;
            background: #f58220;
            margin-top: 8px;
        }

        .description-box p {
            color: #555;
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-line;
        }

        /* Boutons */

        .product-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        .product-btn {
            border: none;
            padding: 14px 20px;
            min-height: 48px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 700;
            transition: .2s ease;
        }

        .product-btn-primary {
            background: #f58220;
            color: #fff;
        }

        .product-btn-primary:hover {
            background: #d96a0b;
            transform: translateY(-1px);
        }

        .product-btn-dark {
            background: #111;
            color: #fff;
        }

        .product-btn-dark:hover {
            background: #2b2b2b;
        }

        .product-btn-light {
            background: #fff;
            color: #333;
            border: 1px solid #ccc;
        }

        .product-btn-light:hover {
            border-color: #f58220;
            color: #f58220;
        }

        /* Informations complémentaires */

        .product-features {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 0;
            color: #555;
            font-size: 14px;
        }

        .feature i {
            width: 25px;
            color: #f58220;
            text-align: center;
        }

        /* Section images */

        .gallery-section {
            margin-top: 30px;
            background: #fff;
            border: 1px solid #e1e1e1;
            padding: 25px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 22px;
            color: #111;
        }

        .section-title i {
            color: #f58220;
        }

        /* Produit introuvable */

        .product-not-found {
            background: #fff;
            border: 1px solid #ddd;
            padding: 60px 25px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .product-not-found i {
            font-size: 55px;
            color: #f58220;
            margin-bottom: 15px;
        }

        .product-not-found h2 {
            color: #111;
            margin-bottom: 10px;
        }

        .product-not-found p {
            color: #777;
            margin-bottom: 20px;
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 900px) {

            .product-main-card {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 25px;
            }

            .product-image-box {
                min-height: 400px;
            }

            .product-image-box img {
                height: 360px;
            }

            .product-title {
                font-size: 26px;
            }
        }

        @media (max-width: 600px) {

            .product-page {
                padding: 20px 0 40px;
            }

            .product-container {
                padding: 0 12px;
            }

            .product-main-card {
                padding: 15px;
                gap: 20px;
            }

            .product-image-box {
                min-height: 280px;
                padding: 15px;
            }

            .product-image-box img {
                height: 270px;
            }

            .product-title {
                font-size: 22px;
            }

            .product-price {
                font-size: 28px;
            }

            .product-actions {
                display: grid;
                grid-template-columns: 1fr;
            }

            .product-btn {
                width: 100%;
            }

            .product-gallery {
                grid-template-columns: repeat(3, 1fr);
            }

            .gallery-item {
                height: 75px;
            }

            .gallery-section {
                padding: 15px;
            }

            .section-title h2 {
                font-size: 19px;
            }

            .breadcrumb {
                font-size: 12px;
            }
        }
        

    </style>
</head>

<body>

    <!-- L'en-tête principal du projet est généré par app.js -->

    <section class="page-hero">
        <div class="container">
            <h1>Détail du produit</h1>
            <p>Découvrez les informations disponibles sur ce produit.</p>
        </div>
    </section>

    <main class="product-page">

        <div class="product-container">

            <!-- Fil d'Ariane -->

            <div class="breadcrumb">

                <a href="../index.html">
                    <i class="fa-solid fa-house"></i>
                    Accueil
                </a>

                <i class="fa-solid fa-chevron-right"></i>

                <a href="produits.html">
                    Produits
                </a>

                <i class="fa-solid fa-chevron-right"></i>

                <span>Détail du produit</span>

            </div>

            <!-- Produit -->

            <div id="productDetail">

                <div class="product-not-found">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <h2>Chargement du produit...</h2>
                    <p>Veuillez patienter.</p>
                </div>

            </div>

        </div>

    </main>

    <!-- Catalogue réel -->
    <script src="../data/catalog.js"></script>

       <!-- JS principal du projet -->
    
    <script src="../assets/js/app.js"></script>

</body>
</html>


    <!-- JS principal du projet -->
    <script src="../assets/js/app.js"></script>

</body>

</html>
